name: Project 1 Autograder

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build main program (make sure it compiles)
        run: |
          g++ -std=c++17 -Wall -c main.cpp -o main.o
          g++ -std=c++17 -Wall -c MusicPlaylist.cpp -o MusicPlaylist.o
          g++ -std=c++17 -Wall -o playlist main.o MusicPlaylist.o

      - name: Build test runner
        run: g++ -std=c++17 -Wall -o test_runner tests/test_main.cpp MusicPlaylist.cpp

      - name: Run tests (pass/fail counts only)
        run: |
          ./test_runner | tee test_summary.txt
          {
            echo "## Project 1 Autograder"
            echo ""
            echo '```'
            cat test_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run memory-leak check (ASan/LeakSanitizer, aggregate only)
        run: |
          make memcheck | tee memcheck_summary.txt
          {
            echo ""
            echo '```'
            cat memcheck_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
